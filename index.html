<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Document</title>
</head>
<body>
    
    <div id="converter-anchors">
    <a href="#" onclick="showSection('length-section')">Length</a>
    <a href="#" onclick="showSection('weight-section')">Weight</a>
    <a href="#" onclick="showSection('temperature-section')">Temperature</a>
</div>

<section id="length-section">
    <h2>Length Converter</h2>
    <form id="converter-form-length">
        <label for="to-convert-length">To convert:</label>
        <input type="number" id="to-convert-length" placeholder="Enter a number">
        <p></p>
        <label for="input-type-length">Type to convert:</label>
        <select id="input-type-length">
            <option value="cm">Centimeter</option>
            <option value="in">Inch</option>
            <option value="ft">Feet</option>
            <option value="m">Meter</option>
            <option value="km">Kilometer</option>
        </select>
        <p></p>
        <label for="output-type-length">Conversion type:</label>
        <select id="output-type-length">
            <option value="cm">Centimeter</option>
            <option value="in">Inch</option>
            <option value="ft">Feet</option>
            <option value="m">Meter</option>
            <option value="km">Kilometer</option>
        </select>
    </form>

    <p id="converted-length-value"></p>
    <button type="button" id="convert-length">Convert weight</button>

</section>

<section id="weight-section">
    <h2>Weight Converter</h2>
    <form id="converter-form-weight">
        <label for="to-convert-weight">To convert:</label>
        <input type="number" id="to-convert-weight" placeholder="Enter a number">
        <p></p>
        <label for="input-type-weight">Type to convert:</label>
        <select id="input-type-weight">
            <option value="g">Gram</option>
            <option value="kg">Kilogram</option>
            <option value="lb">Pound</option>
            <option value="oz">Ounce</option>
        </select>
        <p></p>
        <label for="output-type-weight">Converted type:</label>
        <select id="output-type-weight">
            <option value="g">Gram</option>
            <option value="kg">Kilogram</option>
            <option value="lb">Pound</option>
            <option value="oz">Ounce</option>
        </select>
        <p id="converted-weight-value"></p>
        <button type="button" id="convert-weight">Convert weight</button>
    </form>
</section>

<section id="temperature-section">
    <h2>Temperature Converter</h2>
    <form id="converter-form-temp">
        <label for="to-convert-temp">To convert:</label>
        <input type="number" id="to-convert-temp" placeholder="Enter a number">
        <p></p>
        <label for="input-type-temp">Type to convert:</label>
        <select id="input-type-temp">
            <option value="c">Celsius</option>
            <option value="k">Kelvin</option>
            <option value="f">Fahrenheit</option>
        </select>
        <p></p>
        <label for="output-type-temp">Converted type:</label>
        <select id="output-type-temp">
            <option value="c">Celsius</option>
            <option value="k">Kelvin</option>
            <option value="f">Fahrenheit</option>
        </select>
        <p id="converted-temp-value"></p>
        <button id="convert-temperature">Convert temperature</button>
    </form>
</section>

<script src="converter.js"></script>
</body>
</html>
